# Production profile overrides
spring.config.activate.on-profile=prod

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://police.sqlacademy.vn}

spring.datasource.url=${DB_URL:jdbc:mysql://db-prod:3306/sqlpoliceacademy}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

sandbox.datasource.url=${SANDBOX_DB_URL:jdbc:mysql://db-prod:3306}
sandbox.datasource.username=${SANDBOX_DB_USERNAME:student_sandbox}
sandbox.datasource.password=${SANDBOX_DB_PASSWORD}

website.reset-password=${FRONTEND_URL:https://police.sqlacademy.vn}/reset-password?token=
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=${FRONTEND_URL:https://police.sqlacademy.vn}/payment/success
payos.cancel-url=${FRONTEND_URL:https://police.sqlacademy.vn}/payment/cancel

vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.return-url=${FRONTEND_URL:https://police.sqlacademy.vn}/payment/success

lemonsqueezy.api-key=${LEMONSQUEEZY_API_KEY}
lemonsqueezy.webhook-secret=${LEMONSQUEEZY_WEBHOOK_SECRET}
lemonsqueezy.store-id=${LEMONSQUEEZY_STORE_ID}
lemonsqueezy.variant-id=${LEMONSQUEEZY_VARIANT_ID}
lemonsqueezy.redirect-url=${FRONTEND_URL:https://police.sqlacademy.vn}/payment/success

# Disable API documentation and introspection endpoints in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.jpa.show-sql=false
logging.level.org.springframework.security=INFO
logging.level.com.example.be=INFO

# Restrict exposed management endpoints to health only in production
management.endpoints.web.exposure.include=health