spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=Main-HikariPool

# ==========================================
# PERFORMANCE: GZIP COMPRESSION & BATCH FETCH
# ==========================================
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024
spring.jpa.properties.hibernate.default_batch_fetch_size=30

jwt.expiration=900
rt.expiration=1296000
logging.level.org.springframework.security=INFO
logging.level.com.example.be=INFO
logging.file.name=logs/app.log
logging.logback.rollingpolicy.file-name-pattern=logs/app.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

