spring.application.name=be

cors.allowed-origins=http://localhost:5173
spring.config.import=optional:application-local.properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.datasource.url=jdbc:mysql://localhost:3306/sqlpoliceacademy
spring.datasource.username=root

jwt.expiration=900
rt.expiration=1296000
logging.level.org.springframework.security=INFO
logging.level.com.example.be=INFO
logging.file.name=logs/app.log
logging.logback.rollingpolicy.file-name-pattern=logs/app.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

sandbox.datasource.url=jdbc:mysql://localhost:3306
sandbox.datasource.username=student_sandbox
sandbox.datasource.hikari.maximum-pool-size=20
sandbox.datasource.hikari.pool-name=Sandbox-HikariPool

website.reset-password=http://localhost:5173/reset-password?token=
spring.flyway.repair-on-migrate=true

google.client-id=${GOOGLE_CLIENT_ID:your-client-id-here.apps.googleusercontent.com}

# ==========================================
# 1. PAYOS CONFIG ( my.payos.vn)
# ==========================================
payos.client-id=${PAYOS_CLIENT_ID:your-payos-client-id}
payos.api-key=${PAYOS_API_KEY:your-payos-api-key}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:your-payos-checksum-key}
payos.return-url=http://localhost:5173/payment/success
payos.cancel-url=http://localhost:5173/payment/cancel

# ==========================================
# 2. LEMON SQUEEZY CONFIG (app.lemonsqueezy.com)
# ==========================================
lemonsqueezy.api-key=${LEMONSQUEEZY_API_KEY:your-lemon-api-key}
lemonsqueezy.webhook-secret=${LEMONSQUEEZY_WEBHOOK_SECRET:your-signing-secret}
lemonsqueezy.store-id=${LEMONSQUEEZY_STORE_ID:your-store-id}
lemonsqueezy.variant-id=${LEMONSQUEEZY_VARIANT_ID:your-product-variant-id}
lemonsqueezy.redirect-url=http://localhost:5173/payment/success

vnpay.tmn-code=${VNPAY_TMN_CODE:CGXZPL01}
vnpay.hash-secret=${VNPAY_HASH_SECRET:XNBCJFAKAZQSGTARRLGCHVZWCIOIGSHN}
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:5173/payment/success

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

management.health.db.enabled=true
management.health.diskspace.enabled=true

spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

spring.cache.type=redis

spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
